# The virtio sound card is unknown to ALSA's profile sets, so PipeWire picks an
# output-only profile and the microphone never shows up. "Pro Audio" exposes
# both the speakers and the microphone.
device.profile.priority.rules = [
  {
    matches = [ { alsa.driver_name = "virtio_snd" } ]
    actions = { update-props = { priorities = [ "pro-audio" ] } }
  }
]
