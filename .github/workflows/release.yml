name: Release

# Push a tag like v0.1.0 to build ArchBox.app and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write      # build provenance attestation
  attestations: write

env:
  # Only whether signing is configured; the certificate itself goes to the import step alone.
  HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' }}

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Fail before building if CHANGELOG.md has no section for this version.
      - name: Release notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"

      # Optional: with these secrets set, releases are signed with a Developer ID and
      # notarized. Without them, the build is ad-hoc signed as before.
      - name: Import signing certificate
        if: ${{ env.HAS_DEVELOPER_ID == 'true' }}
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          # Secrets are set, so a signed release was intended: never fall back to ad hoc.
          [ -n "$identity" ] || { echo "No Developer ID Application identity in DEVELOPER_ID_P12" >&2; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build app
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}"

      # Lets anyone check that a zip was built by this workflow from this repository:
      #   gh attestation verify ArchBox-<version>.zip --repo csyio/archbox
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          [[ "$version" == 0.* || "$version" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ArchBox $version" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
