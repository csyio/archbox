name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: scripts/build-app.sh
      - name: Check guest script syntax
        run: bash -n Resources/guest/archbox-provision
